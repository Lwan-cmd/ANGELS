name: Build INGENIUM macOS

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure universal macOS build
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0

      - name: Build VST3 and AU
        run: cmake --build build --config Release --target Ingenium_VST3 Ingenium_AU

      - name: Package plugins
        run: |
          mkdir -p package/VST3
          mkdir -p package/AU
          cp -R "build/Ingenium_artefacts/Release/VST3/INGENIUM.vst3" package/VST3/
          cp -R "build/Ingenium_artefacts/Release/AU/INGENIUM.component" package/AU/

      - name: Upload macOS plugins
        uses: actions/upload-artifact@v4
        with:
          name: INGENIUM-v0.4-macOS-universal
          path: package/
          if-no-files-found: error
